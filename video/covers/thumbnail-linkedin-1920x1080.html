<!doctype html>
<html lang="en"><head><meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>Notchy · LinkedIn thumbnail 1920x1080</title>
<style>
/* Notchy launch covers. Same look as the launch video end card (video/launch/comp-16x9).
   Hero tiles are crops of real Notchy captures with demo data (video/footage/SHOT/still.png, 2x). */
:root { --accent:#7AA7FF; --ink:#F5F7FA; --muted:#AEB7C7; --ground:#05060A;
  --font:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono:"SF Mono", ui-monospace, Menlo, monospace; }
* { margin:0; padding:0; box-sizing:border-box; }
html, body { background:var(--ground); overflow:hidden; }
#root { position:relative; overflow:hidden; background:var(--ground); font-family:var(--font); color:var(--ink);
  -webkit-font-smoothing:antialiased; }
.glow { position:absolute; border-radius:50%;
  background:radial-gradient(closest-side, rgba(122,167,255,0.24), rgba(122,167,255,0) 72%); }

/* wordmark pill, as on the end card */
.pill { position:absolute; display:flex; align-items:center; justify-content:center; background:#000;
  border-radius:999px; box-shadow:0 0 0 1.5px rgba(122,167,255,0.5), 0 20px 60px rgba(122,167,255,0.2); }
.pill span { font-weight:700; letter-spacing:-0.045em; color:var(--ink); }
.chip { position:absolute; display:inline-flex; align-items:center; gap:12px; border-radius:999px; font-weight:600;
  color:#D7DEEA; background:rgba(122,167,255,0.12); box-shadow:inset 0 0 0 1.5px rgba(122,167,255,0.45); }
.chip i { width:12px; height:12px; border-radius:6px; background:var(--accent); box-shadow:0 0 14px rgba(122,167,255,0.9); }

.hook { position:absolute; font-weight:800; letter-spacing:-0.035em; line-height:1.0; }
.hook em { font-style:normal; color:var(--accent); }
.sub { position:absolute; font-weight:500; color:#C9D0DC; line-height:1.25; letter-spacing:-0.005em; }
.by { position:absolute; font-weight:700; letter-spacing:-0.02em; }
.gh { position:absolute; font-family:var(--mono); font-weight:600; color:var(--accent); letter-spacing:-0.01em; }

/* real-UI tile: a cropped window onto a 1920x1080 capture */
.tile { position:absolute; overflow:hidden; border-radius:28px;
  box-shadow:0 40px 120px rgba(0,0,0,0.6), 0 0 0 2px rgba(255,255,255,0.16); }
.tile img { position:absolute; display:block; width:1920px; height:1080px; transform-origin:0 0; }
</style>
<style>
html, body, #root { width:1920px; height:1080px; }
</style></head>
<body><div id="root">
  <div class="glow" style="left:820px; top:-260px; width:1400px; height:1300px;"></div>
  <div class="pill" style="left:110px; top:110px; width:290px; height:96px;"><span style="font-size:60px;">Notchy</span></div>
  <div class="hook" style="left:106px; top:290px; font-size:118px;">Your notch,<br><em>finally useful.</em></div>
  <div class="sub" style="left:110px; top:566px; width:830px; font-size:38px;">AI agent approvals, meeting reminders and Teams &amp; Outlook alerts, right at the notch.</div>
  <div class="by" style="left:110px; top:806px; font-size:54px;">Built by Ujjwal Kumar</div>
  <div class="chip" style="left:110px; top:900px; height:62px; padding:0 28px; font-size:30px;"><i></i>Free &amp; open source</div>

  <!-- real UI: approval card from the notch (approval-card-still frame 76: card settled, label readable, no pointer) -->
  <div class="tile" style="left:1010px; top:130px; width:808px; height:640px;">
    <img src="media/approval-card-settled.png" style="left:-556px; top:0px;" alt="" />
  </div>
  <!-- real UI: meeting reminder banner (banner-meeting still) -->
  <div class="tile" style="left:1010px; top:810px; width:720px; height:150px; border-radius:24px;">
    <img src="media/banner-meeting.png" style="left:-600px; top:-50px;" alt="" />
  </div>
</div></body></html>
